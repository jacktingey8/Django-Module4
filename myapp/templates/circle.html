{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Red Circle</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body>
    <div class="container">
      <div class="circle">
        <div class="circle-text" id="displayText">Double-click anywhere to add a message</div>
      </div>
      <div class="input-section" id="inputModal" style="display:none; position:absolute;">
        <input type="text" id="textInput"/>
        <button id="sendBtn">Send</button>
        <button id="cancelBtn">Cancel</button>
      </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
